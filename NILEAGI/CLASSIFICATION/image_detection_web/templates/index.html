<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MNIST Digit Detection</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 40px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #555;
        }

        canvas {
            border: 2px solid black;
            background: white;
            cursor: crosshair;
            touch-action: none;
        }

        .buttons {
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
        }

        #confidence {
            margin-top: 10px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>MNIST Digit Detection</h1>

    <p>Draw a digit from 0 to 9</p>

    <canvas id="canvas" width="280" height="280"></canvas>

    <div class="buttons">
        <button onclick="clearCanvas()">Clear</button>
        <button onclick="predictDigit()">Predict</button>
    </div>

    <div id="result"></div>

    <div id="confidence"></div>


    <script>

        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        let drawing = false;


        // Set canvas background
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvas.width, canvas.height);


        // Drawing settings
        ctx.strokeStyle = "black";
        ctx.lineWidth = 20;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";


        // Start drawing
        canvas.addEventListener("mousedown", startDrawing);

        // Draw
        canvas.addEventListener("mousemove", draw);

        // Stop drawing
        canvas.addEventListener("mouseup", stopDrawing);
        canvas.addEventListener("mouseout", stopDrawing);


        function startDrawing(event) {
            drawing = true;

            ctx.beginPath();

            ctx.moveTo(
                event.offsetX,
                event.offsetY
            );
        }


        function draw(event) {

            if (!drawing) {
                return;
            }

            ctx.lineTo(
                event.offsetX,
                event.offsetY
            );

            ctx.stroke();
        }


        function stopDrawing() {
            drawing = false;
        }


        // Clear the canvas
        function clearCanvas() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            ctx.fillStyle = "white";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            document.getElementById("result").innerText = "";
            document.getElementById("confidence").innerText = "";
        }


        // Send the drawing to Flask
        async function predictDigit() {

            canvas.toBlob(async function(blob) {

                const formData = new FormData();

                formData.append("image", blob, "digit.png");


                const response = await fetch(
                    "/predict",
                    {
                        method: "POST",
                        body: formData
                    }
                );


                const data = await response.json();


                if (data.error) {

                    document.getElementById("result").innerText =
                        "Error: " + data.error;

                    document.getElementById("confidence").innerText = "";

                    return;
                }


                document.getElementById("result").innerText =
                    "Prediction: " + data.prediction;


                document.getElementById("confidence").innerText =
                    "Confidence: " + data.confidence + "%";

            });

        }

    </script>

</body>
</html>
